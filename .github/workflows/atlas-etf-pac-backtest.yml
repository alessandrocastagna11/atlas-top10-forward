name: Atlas ETF PAC — historical 4-sleeve backtest (research only)
on:
  push:
    branches: [atlas-etf-pac-paper]
    paths:
      - '.github/workflows/atlas-etf-pac-backtest.yml'
      - 'atlas_etf_pac/backtest_replay.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-etf-pac-historical-backtest
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atlas-etf-pac-paper
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate production engine rules
        run: python -m unittest discover -s atlas_etf_pac/tests -p 'test_*.py' -v
      - name: Historical research replay (never alters forward state)
        run: python -u atlas_etf_pac/backtest_replay.py
      - name: Matched 2016-2025 comparison with original frozen V2.3
        run: ATLAS_BACKTEST_END_DATE=2025-12-31 python -u atlas_etf_pac/backtest_replay.py
      - name: Robustness check on actual four ETF histories (2022 onward)
        run: ATLAS_BACKTEST_FIRST_DATE=2022-01-03 ATLAS_BACKTEST_GOLD_PROXY=0 python -u atlas_etf_pac/backtest_replay.py
      - name: Summarize replay
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            for filename,label in [('replay_2016_2026.json','2016-2026 incl. gold proxy'),('replay_2016_2025.json','2016-2025 matched V2.3 window'),('replay_2022_2026_actual4.json','2022-2026 four actual ETFs')]:
              d=json.loads((Path('atlas_etf_pac/backtests')/filename).read_text())
              f.write('## Atlas ETF PAC backtest '+label+'\n')
              for name in ('active','passive_4etf_pac'):
                x=d[name]
                f.write(f"### {name}\nCAGR TWR: {x['twr_cagr_pct']}% | DD: {x['max_drawdown_pct']}% | XIRR: {x['xirr_pct']}% | NAV: EUR {x['final_nav_eur']}\n")
              f.write('\nResearch only; forward ledger unchanged.\n')
          PY
      - name: Archive reproducible research result only
        run: |
          git config user.name 'Atlas ETF Backtest Bot'
          git config user.email 'atlas-etf-backtest@users.noreply.github.com'
          git add atlas_etf_pac/backtests/replay_2016_2026.json atlas_etf_pac/backtests/replay_2016_2025.json atlas_etf_pac/backtests/replay_2022_2026_actual4.json
          if ! git diff --cached --quiet; then
            git commit -m "Research: 4-sleeve PAC historical results"
            git pull --rebase origin atlas-etf-pac-paper
            git push origin HEAD:atlas-etf-pac-paper
          fi

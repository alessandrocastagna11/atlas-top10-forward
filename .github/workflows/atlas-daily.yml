name: Atlas Top 10 daily paper engine
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atlas-daily.yml'
      - 'daily_runner.py'
      - 'engine.py'
      - 'test_*.py'
      - 'v08/shadow_engine.py'
      - 'v08/run_shadow.py'
      - 'v08/tests/**'
  workflow_dispatch:
  schedule:
    # Three independent attempts: Yahoo can publish Xetra/Saudi closes late.
    # GitHub schedules are best effort and may execute several hours late.
    # NY morning retries always target the previous COMPLETE US session.
    - cron: '35 22 * * *'
    - cron: '43 0 * * *'
    - cron: '47 3 * * *'
    - cron: '11 6 * * *'
permissions:
  contents: write
concurrency:
  group: atlas-top10-paper
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - name: Regression tests for original v0.7 (read only)
        run: python -m unittest test_engine test_daily_runner -q
      - name: Synthetic v0.8 tests (27 checks)
        run: python -m unittest discover -s v08/tests -p 'test_*.py' -q
      - name: Check official v0.7 saved state
        run: python daily_runner.py --check
      - name: Update official v0.7 EOD (NO changed strategy rules)
        run: python daily_runner.py
      - name: Update independent v0.8 shadow EOD (Nov 5 first eligible)
        run: python v08/run_shadow.py
      - name: Verify original official ledger again
        run: python daily_runner.py --check
      - name: Audit EOD completeness (workflow success is not a trade)
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          lines=['## Atlas daily data audit', '']
          for path in (Path('reports/latest_status.json'),Path('v08/reports/latest_status.json')):
              if not path.exists():
                  lines.append(f'- **{path}**: unavailable')
                  print(f'::warning title=Atlas missing report::{path}')
                  continue
              data=json.loads(path.read_text(encoding='utf-8'))
              date=data.get('asof',data.get('date','unknown'))
              lines.append(f'### {path} — {date}')
              for name,r in data.get('results',{}).items():
                  status=r.get('report_status',r.get('status','UNKNOWN'))
                  missing=r.get('missing_exact_closes',[])
                  issues=', '.join(x['symbol'] for x in missing)
                  nav=r.get('portfolio_eur',r.get('nav_eur'))
                  cnt=r.get('order_count',r.get('orders',0))
                  lines.append(f'- {name}: **{status}**; NAV={nav}; orders={cnt}; missing close={issues or "none"}')
                  if status=='PENDING_DATA':
                      print(f'::warning title=Atlas quotes incomplete::{name} date={date}; missing exact={issues or "check provider"}')
              lines.append('')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as fh:
              fh.write('\n'.join(lines)+'\n')
          PY
      - name: Save dated ledgers and reports to GitHub
        run: |
          git config user.name "Atlas Paper Bot"
          git config user.email "atlas-paper-bot@users.noreply.github.com"
          git add -A strategies reports market_data v08/state v08/reports v08/market_data
          git diff --cached --quiet || (git commit -m "Atlas EOD paper ledgers $(date -u +%F)" && git push)
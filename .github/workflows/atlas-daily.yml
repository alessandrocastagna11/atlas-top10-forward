name: Atlas V6.6 Hybrid Multifactor — PAPER vs Confidence70
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/atlas-daily.yml']
  schedule:
    - cron: '15 1 * * *'
    - cron: '35 5 * * *'
    # Retry guarded rotations after the NYSE regular opening.
    - cron: '40 15 * * 1-5'
permissions:
  contents: write
concurrency:
  group: atlas-v66-hybrid-live-paper
  cancel-in-progress: false
jobs:
  hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atlas-v66-hybrid-live-paper
          path: hybrid
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: atlas-v4-confidence70-live-paper
          path: confidence
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: confidence/strict_shadow/v4_exact_source/requirements-live.txt
      - name: Install same pinned dependencies as Confidence70
        run: pip install -r confidence/strict_shadow/v4_exact_source/requirements-live.txt
      - name: Check source and execute independent paper challenger
        run: |
          python -m py_compile hybrid/hybrid_v66/run.py
          python -m unittest discover -s hybrid/hybrid_v66 -p 'test_*.py' -v
          python hybrid/hybrid_v66/run.py --source confidence/strict_shadow/v4_exact_source
      - name: Persist only Hybrid ledger or failure diagnostics
        if: always()
        working-directory: hybrid
        run: |
          git config user.name "Atlas Hybrid Paper Bot"
          git config user.email "atlas-hybrid-paper@users.noreply.github.com"
          if [ -d hybrid_v66/ledger ]; then
            git add -A hybrid_v66/ledger
            if ! git diff --cached --quiet; then
              git commit -m "Atlas V6.6 Hybrid paper audit $(date -u +%F)"
              git fetch origin atlas-v66-hybrid-live-paper
              git rebase origin/atlas-v66-hybrid-live-paper
              git push origin HEAD:atlas-v66-hybrid-live-paper
            fi
          fi
      - name: Print comparison and audit
        if: always()
        run: |
          if [ -f hybrid/hybrid_v66/ledger/failure.json ]; then
            cat hybrid/hybrid_v66/ledger/failure.json
            exit 1
          fi
          test -f hybrid/hybrid_v66/ledger/latest.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('hybrid/hybrid_v66/ledger/latest.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## V6.6 Hybrid — PAPER only\n')
              f.write(str(r.get('comparison_latest'))+'\n')
              f.write('Retrospective bootstrap is not a historical live record.\n')
          PY

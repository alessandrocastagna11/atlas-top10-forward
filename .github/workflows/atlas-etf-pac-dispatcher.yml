name: Atlas ETF PAC — daily dispatcher (PAPER ONLY)
on:
  workflow_dispatch:
  schedule:
    # After Xetra EUR session and conservative price-provider settlement.
    # Times are UTC: 20:50/01:20 CET during winter, 21:50/02:20 CEST.
    - cron: '50 19 * * 1-5'
    - cron: '20 0 * * 2-6'
permissions:
  contents: write
concurrency:
  group: atlas-etf-pac-paper
  cancel-in-progress: false
jobs:
  pac_paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atlas-etf-pac-paper
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test PAC rules before changes
        run: python -m unittest discover -s atlas_etf_pac/tests -p 'test_*.py' -v
      - name: Verify and update forward PAC paper
        run: python atlas_etf_pac/engine.py
      - name: Validate zero real-broker access and no historical backfill
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('atlas_etf_pac')
          s=json.loads((d/'state.json').read_text())
          c=json.loads((d/'config.json').read_text())
          r=json.loads((d/'reports/latest_status.json').read_text())
          assert c['no_broker_execution'] is True and r['real_broker_orders']==0
          assert s['model']==c['model']==r['model']
          assert all(x['execution_session']>x['decision_session'] for x in s['orders'])
          assert all(x['mode']=='VIRTUAL_ONLY' for x in s['orders'])
          print('PAPER ONLY; last NAV',r['last_nav_session'],'orders',r['orders_total'])
          PY
      - name: Show actual status
        if: always()
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path('atlas_etf_pac/reports/latest_status.json')
          r=json.loads(p.read_text()) if p.exists() else {}
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Atlas ETF PAC four-sleeve virtual tracker\n\n')
              for k in ('status','nav_eur','cash_eur','orders_total','last_nav_session','max_drawdown_pct'):
                  f.write('- '+k+': '+str(r.get(k,'UNKNOWN'))+'\n')
              f.write('\nNo real money orders. Research reconstruction; not exact V2.3 replay.\n')
          PY
      - name: Commit isolated PAC ledger and quote audit
        if: success()
        run: |
          git config user.name 'Atlas ETF PAC Paper Bot'
          git config user.email 'atlas-etf-pac-paper-bot@users.noreply.github.com'
          git add -A atlas_etf_pac/state.json atlas_etf_pac/reports
          if ! git diff --cached --quiet; then
            git commit -m "Atlas ETF PAC automated paper $(date -u +%F)"
            git pull --rebase origin atlas-etf-pac-paper
            git push origin HEAD:atlas-etf-pac-paper
          fi

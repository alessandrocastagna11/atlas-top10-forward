name: Atlas V4 ORIGINAL Confidence70 — forward PAPER
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/atlas-v4-exact-forward.yml']
  # Avoid a flood of temporary CI failures from intermediate code pushes.
  # Scheduled original-PAPER updates and explicit manual runs remain enabled.
  schedule:
    # NY 17:30 EOD cutoff. Aim before next Tokyo equity session.
    - cron: '35 22 * * *'
    - cron: '5 23 * * 1-5'
    # Recovery after delayed EOD/vendor publication, before the morning report.
    - cron: '15 5 * * 1-6'
    # Late feed retry for US-only baskets (global open cutoff still enforced).
    # Late retry disabled to avoid write contention with the midnight dispatcher.
    # - cron: '25 0 * * 2-6'
permissions:
  contents: write
concurrency:
  group: atlas-v4-confidence70-live-paper
  cancel-in-progress: false
jobs:
  exact_v4_paper:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Record this run start for freshness attestation
        run: echo "ATLAS_RUN_STARTED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          # Schedules are on main but only the isolated original-V4 branch runs.
          ref: atlas-v4-confidence70-live-paper
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: strict_shadow/v4_exact_source/requirements-live.txt
      - name: Install fixed research dependencies
        run: pip install -r strict_shadow/v4_exact_source/requirements-live.txt
      - name: Restore historical adjusted-price cache (not an investment ledger)
        uses: actions/cache@v4
        with:
          path: strict_shadow/v4_exact_source/cache_adjusted
          key: atlas-v4-adjusted-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            atlas-v4-adjusted-${{ runner.os }}-
      - name: Refresh as-recorded roster and daily unadjusted quote/FX feed
        run: python strict_shadow/live_v4/dataset_daily.py --limit 650 --start 2024-01-01
      - name: Capture daily as-observed issuer market caps (shadow, no retroactive PIT substitution)
        run: python strict_shadow/v4_exact_source/marketcap_pit.py
      - name: Update independent ECB FX audit
        run: python strict_shadow/live_v4/ecb_fx.py --start 2012-01-01
      - name: Verify original frozen source hashes
        run: python strict_shadow/v4_exact_source/readiness.py
      - name: Original engine smoke tests and fail-closed controls
        run: python -m unittest discover -s strict_shadow/v4_exact_source/live_tests -p 'test_*.py' -v
      - name: Update adjusted global market and generate original-engine PAPER
        env:
          ATLAS_EXACT_DEBUG: '1'
          ATLAS_MULTISOURCE_OPT_IN: ${{ vars.ATLAS_MULTISOURCE_OPT_IN }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python strict_shadow/v4_exact_source/run_live.py
      - name: Advance 35-day FIFO forward PAPER with disclosed previous-close approximation
        run: python strict_shadow/v4_exact_source/paper_account.py
      - name: Summarize actual state (success never means an order)
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('strict_shadow/v4_exact_source/forward/latest_status.json')
          j=json.loads(p.read_text()) if p.exists() else {}
          lines=['## Atlas V4 — ORIGINAL source, PAPER only',
                 '- State: **'+str(j.get('status','NO_REPORT'))+'**',
                 '- Reason: '+str(j.get('reason','none')),
                 '- Session: '+str(j.get('decision_session','none')),
                 '- Virtual orders: '+str(j.get('orders_cumulative','unchanged')),
                 '- New orders: '+str(j.get('new_orders',0)),
                 '- Cash: '+str(j.get('cash_eur','not yet valued')),
                 '- Positions: '+str(j.get('positions_count','not yet valued')),
                 '- Holding limit: **35 calendar days per lot, including defensive sales**',
                 '- Portfolio report: strict_shadow/v4_exact_source/forward/latest.md',
                 '- NAV: '+str(j.get('nav_eur','unchanged')),
                 '- Original 2026 PIT-market-cap membership certified: **NO**',
                 '- Broker orders: **ZERO**']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('\n'.join(lines))
          PY
      - name: Persist original-paper audit, including failed-data diagnostics
        # Preserve failure evidence even when no new signal or PAPER trade is valid.
        # Never publish a fabricated new trade; source run fails closed.
        if: always()
        run: |
          git config user.name "Atlas V4 Original Paper Bot"
          git config user.email "atlas-v4-original-paper@users.noreply.github.com"
          git add -A strict_shadow/v4_exact_source/forward
          git add -A strict_shadow/v4_exact_source/reports
          if [ -d strict_shadow/live_v4/dataset ]; then
            git add -A strict_shadow/live_v4/dataset
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Atlas V4 original source daily PAPER audit $(date -u +%F)"
            # The branch may move between fetch and push (e.g. a code fix).
            # Retry a safe fast-forward rebase; NEVER force-push paper ledgers.
            for attempt in 1 2 3 4 5; do
              git fetch origin atlas-v4-confidence70-live-paper
              git rebase origin/atlas-v4-confidence70-live-paper || { git rebase --abort; exit 1; }
              if git push origin HEAD:atlas-v4-confidence70-live-paper; then
                echo "PAPER REPORT COMMITTED AND PUSHED"
                exit 0
              fi
              sleep $((attempt * 2))
            done
            echo "::error::V4 paper ledger publish failed after five non-force retries"
            exit 1
          fi

      - name: Require an actual updated model signal (not merely a successful paper account)
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('strict_shadow/v4_exact_source/forward/latest_status.json')
          status=json.loads(path.read_text()) if path.is_file() else {}
          engine=status.get('signal_engine_status')
          plan=status.get('indicative_order_test') or {}
          if engine!='SIGNAL_READY' or plan.get('status')!='INDICATIVE_ONLY_NO_ORDER_NO_FILL':
              print('::error::V4 model/plan failed; paper account alone does not prove success. '
                    +str(status.get('signal_engine_error') or plan.get('reason') or engine))
              raise SystemExit(1)
          if status.get('shared_input_status')!='PUBLISHED_LOSSLESS' or not status.get('shared_input',{}).get('sha256'):
              print('::error::Common snapshot unavailable: '+str(status.get('shared_input_error')))
              raise SystemExit(1)
          local=status.get('local_eod_quote_audit') or {}
          if local.get('status') not in ('COMPLETE','PARTIAL_CALENDAR_COVERAGE') or local.get('stale_or_missing'):
              print('::error::Local exchange EOD freshness audit failed: '+str(local.get('stale_or_missing')))
              raise SystemExit(1)
          if local.get('calendar_unverified'):
              print('::warning::Exact calendar not available: '+str(local['calendar_unverified']))
          print('LOCAL EOD AUDIT',local['status'],len(local.get('expected_session_by_symbol',{})))
          fx=status.get('fx_freshness_audit') or {}
          if fx.get('status') not in ('COMPLETE','DEGRADED') or fx.get('blocked'):
              print('::error::FX freshness audit failed: '+str(fx))
              raise SystemExit(1)
          if fx.get('degraded'):
              print('::warning::FX one weekday late: '+str(fx['degraded']))
          cash=status.get('cash_rate_audit') or {}
          if cash.get('status') not in ('REFRESHED','VERIFIED_CACHE') or not cash.get('last_observation'):
              print('::error::ECB DFR audit missing: '+str(cash))
              raise SystemExit(1)
          import os,datetime as dt
          start=dt.datetime.fromisoformat(os.environ['ATLAS_RUN_STARTED_UTC'].replace('Z','+00:00'))
          recorded=status.get('last_report_recorded_at_utc')
          if not recorded or dt.datetime.fromisoformat(recorded.replace('Z','+00:00'))<start:
              print('::error::Report was not generated by this workflow run')
              raise SystemExit(1)
          multi=status.get('multisource_audit') or {}
          if multi.get('decision_session')!=status.get('decision_session'):
              print('::error::Multi-source audit missing or from another session')
              raise SystemExit(1)
          print('MULTISOURCE AUDIT',multi.get('status'),multi.get('independent_agreements',0))
          if multi.get('status')=='AUDIT_ERROR':
              print('::warning::Optional source audit failed: '+str(multi.get('error_type','unknown')))
          print('RECIPROCAL FX RECOVERY',sorted((status.get('fx_recovery_audit') or {}).keys()))
          if multi.get('status')=='REVIEW_REQUIRED':
              print('::warning::Independent source disagreement; no automatic price substitution')
          print('FX AUDIT',fx['status'],'ECB DFR',cash['status'],cash['last_observation'])
          migration=status.get('universe_transition_audit') or {}
          if (migration.get('active_roster_sha256')!=status['shared_input']['roster_sha256']
              or migration.get('decision_session')!=status.get('decision_session')
              or migration.get('active_usa')!=100 or migration.get('active_nonusa')!=200
              or len(set(migration.get('active_symbols',[])))!=300):
              print('::error::Shared universe transition audit mismatch')
              raise SystemExit(1)
          if status['decision_session']>='2026-11-30' and migration.get('status')!='EXPANDED_ACTIVE':
              print('::error::Expanded source not active')
              raise SystemExit(1)
          print('UNIVERSE MIGRATION',migration['status'],migration.get('candidate_pool_size'),
                migration.get('common_usa'),migration.get('common_nonusa'))
          print('COMMON INPUT SHA256',status['shared_input']['sha256'])
          print('V4 ORIGINAL SIGNAL HEALTHY',status.get('decision_session'),
                status.get('data_universe'),
                status.get('short_history_excluded_from_daily_universe',[]))
          PY

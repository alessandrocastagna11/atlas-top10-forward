name: Atlas V4 ORIGINAL Confidence70 — forward PAPER
on:
  workflow_dispatch:
  push:
    branches: [atlas-v4-confidence70-live-paper]
    paths:
      - 'strict_shadow/v4_exact_source/live_model.py'
      - 'strict_shadow/v4_exact_source/marketcap_pit.py'
      - 'strict_shadow/v4_exact_source/model_proposal.py'
      - 'strict_shadow/v4_exact_source/run_live.py'
      - 'strict_shadow/v4_exact_source/frozen_region.py'
      - 'strict_shadow/v4_exact_source/live_simulator.py'
      - 'strict_shadow/v4_exact_source/paper_reporting.py'
      - 'strict_shadow/v4_exact_source/live_tests/**'
      - 'strict_shadow/v4_exact_source/requirements-live.txt'
      - '.github/workflows/atlas-v4-exact-forward.yml'
  schedule:
    # NY 17:30 EOD cutoff. Aim before next Tokyo equity session.
    - cron: '35 22 * * *'
    - cron: '5 23 * * 1-5'
    # Late feed retry for US-only baskets (global open cutoff still enforced).
    # Late retry disabled to avoid write contention with the midnight dispatcher.
    # - cron: '25 0 * * 2-6'
permissions:
  contents: write
concurrency:
  group: atlas-v4-confidence70-live-paper
  cancel-in-progress: false
jobs:
  exact_v4_paper:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Schedules are on main but only the isolated original-V4 branch runs.
          ref: atlas-v4-confidence70-live-paper
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: strict_shadow/v4_exact_source/requirements-live.txt
      - name: Install fixed research dependencies
        run: pip install -r strict_shadow/v4_exact_source/requirements-live.txt
      - name: Restore historical adjusted-price cache (not an investment ledger)
        uses: actions/cache@v4
        with:
          path: strict_shadow/v4_exact_source/cache_adjusted
          key: atlas-v4-adjusted-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            atlas-v4-adjusted-${{ runner.os }}-
      - name: Refresh as-recorded roster and daily unadjusted quote/FX feed
        run: python strict_shadow/live_v4/dataset_daily.py --limit 300 --start 2024-01-01
      - name: Capture daily as-observed issuer market caps (shadow, no retroactive PIT substitution)
        run: python strict_shadow/v4_exact_source/marketcap_pit.py
      - name: Update independent ECB FX audit
        run: python strict_shadow/live_v4/ecb_fx.py --start 2012-01-01
      - name: Verify original frozen source hashes
        run: python strict_shadow/v4_exact_source/readiness.py
      - name: Original engine smoke tests and fail-closed controls
        run: python -m unittest discover -s strict_shadow/v4_exact_source/live_tests -p 'test_*.py' -v
      - name: Update adjusted global market and generate original-engine PAPER
        env:
          ATLAS_EXACT_DEBUG: '1'
        run: python strict_shadow/v4_exact_source/run_live.py
      - name: Advance 35-day FIFO forward PAPER with disclosed previous-close approximation
        run: python strict_shadow/v4_exact_source/paper_account.py
      - name: Summarize actual state (success never means an order)
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('strict_shadow/v4_exact_source/forward/latest_status.json')
          j=json.loads(p.read_text()) if p.exists() else {}
          lines=['## Atlas V4 — ORIGINAL source, PAPER only',
                 '- State: **'+str(j.get('status','NO_REPORT'))+'**',
                 '- Reason: '+str(j.get('reason','none')),
                 '- Session: '+str(j.get('decision_session','none')),
                 '- Virtual orders: '+str(j.get('orders_cumulative','unchanged')),
                 '- New orders: '+str(j.get('new_orders',0)),
                 '- Cash: '+str(j.get('cash_eur','not yet valued')),
                 '- Positions: '+str(j.get('positions_count','not yet valued')),
                 '- Holding limit: **35 calendar days per lot, including defensive sales**',
                 '- Portfolio report: strict_shadow/v4_exact_source/forward/latest.md',
                 '- NAV: '+str(j.get('nav_eur','unchanged')),
                 '- Original 2026 PIT-market-cap membership certified: **NO**',
                 '- Broker orders: **ZERO**']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('\n'.join(lines))
          PY
      - name: Persist only original-paper audit and deterministic ledgers
        if: success()
        run: |
          git config user.name "Atlas V4 Original Paper Bot"
          git config user.email "atlas-v4-original-paper@users.noreply.github.com"
          git add -A strict_shadow/v4_exact_source/forward
          git add -A strict_shadow/v4_exact_source/reports
          if [ -d strict_shadow/live_v4/dataset ]; then
            git add -A strict_shadow/live_v4/dataset
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Atlas V4 original source daily PAPER audit $(date -u +%F)"
            # The branch may move between fetch and push (e.g. a code fix).
            # Retry a safe fast-forward rebase; NEVER force-push paper ledgers.
            for attempt in 1 2 3 4 5; do
              git fetch origin atlas-v4-confidence70-live-paper
              git rebase origin/atlas-v4-confidence70-live-paper || { git rebase --abort; exit 1; }
              if git push origin HEAD:atlas-v4-confidence70-live-paper; then
                echo "PAPER REPORT COMMITTED AND PUSHED"
                exit 0
              fi
              sleep $((attempt * 2))
            done
            echo "::error::V4 paper ledger publish failed after five non-force retries"
            exit 1
          fi

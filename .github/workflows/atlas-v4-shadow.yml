name: Atlas V4 Confidence70 shadow monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '40 22 * * 1-5'
permissions:
  contents: write
jobs:
  shadow-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atlas-strict-v12-shadow
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check exact-engine input (fail closed)
        run: python strict_shadow/monitor.py
      - name: Persist shadow status only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strict_shadow/status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update V4 shadow data status"
            git push origin HEAD:atlas-strict-v12-shadow
          fi

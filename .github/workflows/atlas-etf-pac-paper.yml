name: Atlas ETF PAC — isolated 4-ETF paper
on:
  push:
    branches: [atlas-etf-pac-paper]
    paths:
      - '.github/workflows/atlas-etf-pac-paper.yml'
      - 'atlas_etf_pac/engine.py'
      - 'atlas_etf_pac/config.json'
      - 'atlas_etf_pac/tests/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-etf-pac-paper
  cancel-in-progress: false
jobs:
  forward_pac:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atlas-etf-pac-paper
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline forward and fiscal accounting regression
        run: python -m unittest discover -s atlas_etf_pac/tests -p 'test_*.py' -v
      - name: Refresh completed EUR Xetra ETF OHLC and prospective PAC ledger
        run: python atlas_etf_pac/engine.py
      - name: Fail closed on accidental broker or strategy identity change
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('atlas_etf_pac')
          cfg=json.loads((root/'config.json').read_text())
          st=json.loads((root/'state.json').read_text())
          report=json.loads((root/'reports/latest_status.json').read_text())
          assert cfg['no_broker_execution'] is True
          assert cfg['mode']=='PAPER_ONLY_RESEARCH_RECONSTRUCTION'
          assert cfg['model']==st['model']==report['model']
          assert report['real_broker_orders']==0
          assert len(st['orders'])<=cfg['max_total_orders_per_month']*max(1, len({x['execution_session'][:7] for x in st['orders']}))
          assert all(x['mode']=='VIRTUAL_ONLY' for x in st['orders'])
          print('PAPER INVARIANTS PASS')
          PY
      - name: Audit status without treating successful workflow as actual investment
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os
          p=Path('atlas_etf_pac/reports/latest_status.json')
          data=json.loads(p.read_text()) if p.exists() else {}
          lines=['## Atlas ETF 65/15/10/10 PAC (virtual research reconstruction)',
                 'Status: '+str(data.get('status','NO_REPORT')),
                 'NAV EUR: '+str(data.get('nav_eur','PENDING')),
                 'Total PAPER trades: '+str(data.get('orders_total',0)),
                 'Last verified NAV date: '+str(data.get('last_nav_session','N/A')),
                 'Pending next-session decision: '+str(bool(data.get('pending_orders'))),
                 'Original frozen V2.3 parity: NOT CLAIMED',
                 'Real broker trades: ZERO','']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('\n'.join(lines))
          PY
      - name: Persist only isolated Atlas ETF virtual ledgers
        if: success()
        run: |
          git config user.name 'Atlas ETF PAC Paper Bot'
          git config user.email 'atlas-etf-pac-paper-bot@users.noreply.github.com'
          git add -A atlas_etf_pac/state.json atlas_etf_pac/reports
          if ! git diff --cached --quiet; then
            git commit -m "Atlas ETF PAC daily PAPER $(date -u +%F)"
            git pull --rebase origin atlas-etf-pac-paper
            git push origin HEAD:atlas-etf-pac-paper
          fi

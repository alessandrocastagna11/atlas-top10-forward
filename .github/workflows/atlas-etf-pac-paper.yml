name: Atlas ETF PAC V2.3 ORIGINAL — virtual forward
on:
  push:
    branches: [atlas-etf-pac-paper]
    paths:
      - '.github/workflows/atlas-etf-pac-paper.yml'
      - 'atlas_etf_pac/engine.py'
      - 'atlas_etf_pac/config.json'
      - 'atlas_etf_pac/tests/**'
      - 'atlas_etf_pac/v23_original/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-etf-pac-paper
  cancel-in-progress: false
jobs:
  forward_pac:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atlas-etf-pac-paper
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact original V2.3 source audit and paper account regression
        run: python -m unittest discover -s atlas_etf_pac/tests -p 'test_*.py' -v
      - name: Refresh real EUNL and EuroGov prices, causal macro, and prospective V2.3 virtual ledger
        run: python -u atlas_etf_pac/engine.py
      - name: Verify no broker and no retroactive execution
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=Path('atlas_etf_pac')
          c=json.loads((d/'config.json').read_text())
          s=json.loads((d/'state.json').read_text())
          r=json.loads((d/'reports/latest_status.json').read_text())
          assert c['no_broker_execution'] is True and r['real_broker_orders']==0
          assert c['model']==s['model']==r['model']=='ATLAS_ETF_PAC_V23_ORIGINAL_LIVE_V1'
          assert all(x['execution_session']>x['decision_session'] and x['mode']=='VIRTUAL_ONLY' for x in s['orders'])
          assert r['contributed_eur']==1000+sum(float(x['amount_eur']) for x in s['contributions'])
          assert len({o['execution_session']+'|'+o['sleeve']+'|'+o['side'] for o in s['orders']})==len(s['orders'])
          print('V23 paper invariant check OK; latest status:',r['status'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('## Atlas ETF PAC — V2.3 original LIVE adapter (paper only)\n\n')
            for k in ('status','nav_eur','cash_eur','orders_total','last_nav_session','max_drawdown_pct','source_quality'):
              f.write(f'- **{k}**: {r.get(k,"UNKNOWN")}\n')
            f.write('\nTrading is VIRTUAL ONLY. Macro may use explicit historical carry proxy.\n')
          PY
      - name: Persist V2.3 prospective account, quote provenance and cached sources
        if: always()
        run: |
          git config user.name 'Atlas ETF V2.3 Paper Bot'
          git config user.email 'atlas-etf-pac-paper-bot@users.noreply.github.com'
          git add -A atlas_etf_pac/state.json atlas_etf_pac/reports atlas_etf_pac/live_cache
          if ! git diff --cached --quiet; then
            git commit -m "Atlas ETF V2.3 daily PAPER $(date -u +%F)"
            git pull --rebase origin atlas-etf-pac-paper
            git push origin HEAD:atlas-etf-pac-paper
          fi

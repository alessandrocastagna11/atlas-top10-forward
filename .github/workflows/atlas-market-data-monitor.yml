name: Atlas shared asynchronous market data monitor (READ ONLY)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'atlas_data_monitor/**'
      - '.github/workflows/atlas-market-data-monitor.yml'
  schedule:
    # Best-effort GitHub schedule, not a real-time SLA. Four attempts/hour.
    - cron: '11,26,41,56 * * * 0-5'
    - cron: '17 */2 * * 6'
  workflow_run:
    workflows: ['Atlas V4 ORIGINAL Confidence70 — forward PAPER']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: atlas-market-data-monitor-only
  cancel-in-progress: false
jobs:
  monitor:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout monitor code
        uses: actions/checkout@v4
        with:
          ref: main
          path: monitor
          persist-credentials: false
      - name: Read original account and source roster without write credentials
        uses: actions/checkout@v4
        with:
          ref: atlas-v4-confidence70-live-paper
          path: original
          persist-credentials: false
      - name: Read independent Top5 account without write credentials
        uses: actions/checkout@v4
        with:
          ref: atlas-top5-mom10-live-paper
          path: challenger
          persist-credentials: false
      - name: Checkout isolated monitor output branch
        uses: actions/checkout@v4
        with:
          ref: atlas-market-data-live
          path: output
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify monitor syntax and read-only regression tests
        env:
          PYTHONPATH: original/strict_shadow/live_v4
        run: |
          python -m py_compile monitor/atlas_data_monitor/monitor.py original/strict_shadow/live_v4/dataset_daily.py
          python -m unittest discover -s monitor/atlas_data_monitor -p 'test_*.py' -v
      - name: Determine whether capitalization refresh is due
        id: cap
        run: |
          python - <<'PY'
          import datetime as dt,json,os
          from pathlib import Path
          path=Path('output/atlas_market_data/latest_status.json')
          now=dt.datetime.now(dt.timezone.utc)
          old=json.loads(path.read_text()) if path.is_file() else {}
          cap=old.get('capitalization') or {}
          seen=cap.get('observed_at_utc')
          due=not seen or (now-dt.datetime.fromisoformat(seen)).total_seconds()>=3600
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('due='+str(due).lower()+'\n')
          PY
      - name: Refresh observed capitalizations when actually due, in read-only source copy
        if: steps.cap.outputs.due == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 5
        run: python original/strict_shadow/v4_exact_source/marketcap_pit.py
      - name: Capture latest reported quotes and completed local daily bars; never call either model
        run: |
          python monitor/atlas_data_monitor/monitor.py --source original --challenger challenger --out output/atlas_market_data
      - name: Publish monitor snapshots only; no account branch pushes
        working-directory: output
        run: |
          git config user.name "Atlas Market Monitor Bot"
          git config user.email "atlas-market-monitor@users.noreply.github.com"
          git add -A atlas_market_data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Market observation $(date -u +%FT%TZ)"
          git pull --rebase origin atlas-market-data-live
          git push origin HEAD:atlas-market-data-live

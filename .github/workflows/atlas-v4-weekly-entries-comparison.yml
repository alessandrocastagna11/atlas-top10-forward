name: Atlas V4 weekly-entry original-vs-challenger (NON-PIT research)
on:
  push:
    branches: [atlas-v4-confidence70-live-paper]
    paths:
      - 'strict_shadow/v4_exact_source/scripts/compare_weekly_entry_2025_2026.py'
      - '.github/workflows/atlas-v4-weekly-entries-comparison.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-v4-weekly-entries-comparison
  cancel-in-progress: false
jobs:
  paired_exact_engine_study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atlas-v4-confidence70-live-paper
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: strict_shadow/v4_exact_source/requirements-live.txt
      - name: Install fixed exact-engine research dependencies
        run: pip install -r strict_shadow/v4_exact_source/requirements-live.txt
      - name: Restore public historical adjusted-price cache (not a portfolio)
        uses: actions/cache@v4
        with:
          path: strict_shadow/v4_exact_source/cache_adjusted
          key: atlas-v4-adjusted-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            atlas-v4-adjusted-${{ runner.os }}-
      - name: Run paired tax-aware exact engine on identical historical provider bars
        env:
          ATLAS_STUDY_START: '2025-03-03'
          ATLAS_STUDY_ASOF: '2026-11-10'
        run: python strict_shadow/v4_exact_source/scripts/compare_weekly_entry_2025_2026.py
      - name: Publish study comparison in GitHub job summary
        if: always()
        run: |
          if [ -f strict_shadow/v4_exact_source/runs/weekly_buy_study/comparison.md ]; then
            cat strict_shadow/v4_exact_source/runs/weekly_buy_study/comparison.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Research did not complete; no performance claim is permitted"
            exit 1
          fi
      - name: Commit only separate NON-PIT research outputs
        if: success()
        run: |
          git config user.name "Atlas V4 Research Bot"
          git config user.email "atlas-v4-research-bot@users.noreply.github.com"
          git add -A strict_shadow/v4_exact_source/runs/weekly_buy_study
          if ! git diff --cached --quiet; then
            git commit -m "V4 weekly-entry paired current-cohort NON-PIT comparison"
            for i in 1 2 3 4 5; do
              git fetch origin atlas-v4-confidence70-live-paper
              git rebase origin/atlas-v4-confidence70-live-paper || { git rebase --abort; exit 1; }
              if git push origin HEAD:atlas-v4-confidence70-live-paper; then exit 0; fi
              sleep $((i * 2))
            done
            exit 1
          fi

name: Atlas V4 historical data acquisition (research)
on:
  workflow_dispatch:
  push:
    branches: [atlas-strict-v12-shadow]
    paths:
      - 'strict_shadow/acquisition/**'
      - '.github/workflows/atlas-v4-data-acquisition.yml'
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests
      - name: Check recovered historical symbol list
        run: |
          test -s strict_shadow/acquisition/input/global200_symbols_recovered.csv || { echo "::error::Missing recovered historical symbol list."; exit 1; }
      - name: Acquire historical prices and FX
        run: python strict_shadow/acquisition/acquire.py --input strict_shadow/acquisition/input/global200_symbols_recovered.csv --out downloaded --start 2010-01-01 --end 2025-12-11
      - name: Audit price coverage
        if: always()
        run: |
          if [ -s strict_shadow/acquisition/input/global200_symbols_recovered.csv ]; then
            python strict_shadow/acquisition/audit.py --input strict_shadow/acquisition/input/global200_symbols_recovered.csv --data downloaded
          fi
      - name: Archive acquired research data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v4-research-data-${{ github.run_id }}
          path: downloaded/
          retention-days: 30
          if-no-files-found: warn
